; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; IMPORTANT : espressif32 est épinglé sur 6.9.0 (arduino-esp32 2.0.x) pour
; garantir la présence du driver RMT "legacy" (driver/rmt.h), utilisé par
; ce projet. Avec arduino-esp32 3.x, le driver legacy est encore présent
; mais marqué déprécié : compile aussi, avec des avertissements.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = default.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    prune74/CanUniversal